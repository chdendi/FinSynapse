name: Daily ingest + dashboard publish

# Triggers:
#  - schedule:
#      * 09:30 UTC Mon-Fri = 17:30 BJT, after CN/HK cash close
#      * 22:00 UTC daily   = 06:00 BJT, after US cash close
#  - workflow_dispatch: manual run from the Actions UI for testing.
on:
  schedule:
    - cron: '30 9 * * 1-5'
    - cron: '0 22 * * *'
  workflow_dispatch:

# Default to read-only at workflow level — least privilege. Any future
# job added to this workflow inherits read-only unless it explicitly opts
# into more. Each job below opts into only the writes it needs.
permissions:
  contents: read

concurrency:
  group: daily
  cancel-in-progress: false  # never cancel a partial-data publish

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Required by:
      #   - "Commit generated brief back to main" — push to main
      #   - "Deploy dashboard to GitHub Pages" (peaceiris) — push to gh-pages
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python deps
        run: uv sync --frozen

      - name: Ingest all sources (bronze)
        env:
          # FRED key is the only ingest secret. AkShare, yfinance, multpl,
          # Treasury rates/FiscalData, and HKMA need no auth. The DeepSeek key
          # is passed only to the brief-generation step below.
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: uv run finsynapse ingest all --lookback-days 5500

      - name: Transform bronze -> silver (incl. temperature, divergence, health)
        run: uv run finsynapse transform run --layer all

      - name: Generate daily macro brief (LLM narrative or deterministic template)
        # Try DeepSeek directly; a missing key or API error falls back to the
        # deterministic template. Override the default Flash model with the
        # DAILY_BRIEF_MODEL repository variable (no workflow edit required).
        # `|| true` so a transient brief failure doesn't block publish.
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          BRIEF_MODEL: ${{ vars.DAILY_BRIEF_MODEL || 'deepseek-flash' }}
        run: uv run finsynapse report brief --provider deepseek --model "$BRIEF_MODEL" || true

      - name: Render bilingual static dashboard
        # CLARITY_PROJECT_ID drives the Microsoft Clarity tracking snippet
        # injected into every page's <head>. Stored as a repo Secret (the ID
        # is technically public — it lands in the rendered HTML anyway — but
        # using `secrets` matches how the project already configures other
        # third-party IDs/keys). When unset, the partial renders to nothing
        # and pages stay un-tracked.
        env:
          CLARITY_PROJECT_ID: ${{ secrets.CLARITY_PROJECT_ID }}
        run: uv run finsynapse dashboard render --out-dir dist

      - name: Commit generated brief back to main
        # The brief is content the team reviews historically; check it into
        # the repo (small markdown, no binary), not just an artifact. Skips
        # cleanly when nothing changed (e.g. transform aborted earlier).
        # Retries with rebase on push rejection — the workflow runs for a
        # few minutes, and a manual push to main during that window would
        # otherwise hard-fail this step.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$(git status --porcelain data/gold/brief/)" ]; then
            echo "[brief] no new/changed brief files — skipping commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/gold/brief/
          git commit -m "chore(brief): daily macro brief $(date -u +%Y-%m-%d)"

          branch="${{ github.ref_name }}"
          for attempt in 1 2 3; do
            git fetch origin "$branch"
            # Rebase our brief commit on top of any concurrent main pushes
            # (data/gold/brief/*.md is the only file we touch — no conflict
            # possible unless two daily runs raced, which concurrency:
            # cancel-in-progress: false already prevents).
            git rebase "origin/$branch" || { git rebase --abort; exit 1; }
            if git push origin "HEAD:$branch"; then
              echo "[brief] pushed on attempt $attempt"
              exit 0
            fi
            echo "[brief] push rejected on attempt $attempt — retrying after rebase"
            sleep 2
          done
          echo "[brief] push still failing after 3 attempts — giving up"
          exit 1

      - name: Push state-change notifications (skipped if no secrets)
        env:
          BARK_DEVICE_KEY: ${{ secrets.BARK_DEVICE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: uv run finsynapse notify check

      - name: Upload silver as artifact (30-day retention)
        uses: actions/upload-artifact@v7
        with:
          name: silver-${{ github.run_id }}
          path: data/silver/
          retention-days: 30

      - name: Deploy dashboard to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          commit_message: "publish dashboard ${{ github.run_number }}"
          # Don't keep history bloated — squash to one commit per push.
          force_orphan: true

  update-alert:
    name: Update daily CI alert
    needs: build-and-publish
    # A separate job can report a build timeout. Cancellation is not recovery,
    # and manual runs on other branches must not change the main alert.
    if: >-
      ${{ always() && !cancelled() && github.ref == 'refs/heads/main' &&
          (needs.build-and-publish.result == 'success' || needs.build-and-publish.result == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Create, update, or close the daily alert
        uses: actions/github-script@v9
        env:
          BUILD_RESULT: ${{ needs.build-and-publish.result }}
        with:
          script: |
            const updateAlert = require('./.github/scripts/daily-alert.cjs');
            await updateAlert({
              github, context, core,
              result: process.env.BUILD_RESULT,
              runAttempt: Number(process.env.GITHUB_RUN_ATTEMPT),
            });
